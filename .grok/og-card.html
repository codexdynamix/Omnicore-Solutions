<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Inter Display";
      src: url("fonts/InterDisplay-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1260px;
      overflow: hidden;
      background: #F5F5F7;
    }
    .stage {
      width: 2400px;
      height: 1260px;
      background: #F5F5F7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mark {
      width: 340px;
      height: auto;
      display: block;
    }
    .name {
      margin-top: 72px;
      font-family: "Inter Display", "Inter", "Liberation Sans", sans-serif;
      font-weight: 700;
      font-size: 112px;
      letter-spacing: 0.14em;
      color: #1D1D1F;
      line-height: 1;
      padding-left: 0.14em; /* optical center with tracking */
    }
    .word {
      margin-top: 22px;
      font-family: "Inter", "Liberation Sans", sans-serif;
      font-weight: 500;
      font-size: 44px;
      letter-spacing: 0.52em;
      color: #6E6E73;
      line-height: 1;
      padding-left: 0.52em;
    }
    .rule {
      margin-top: 48px;
      width: 96px;
      height: 4px;
      background: #0071E3;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <img class="mark" src="mark-tight.png" alt="" />
      <div class="name">OMNICORE</div>
      <div class="word">SOLUTIONS</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
